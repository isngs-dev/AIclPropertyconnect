# Backend (FastAPI) for Render.com. Netlify cannot run Python servers, so the API lives here.
services:
  - type: web
    name: aicl-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python -m app.seed
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL        # paste your Render PostgreSQL "Internal Database URL", but change the start to postgresql+psycopg://
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock               # use paystack + PAYSTACK_SECRET_KEY for real test payments
      - key: FRONTEND_URL
        sync: false               # your Netlify URL, e.g. https://aicl-portal.netlify.app
      - key: CORS_ORIGINS
        sync: false               # same as FRONTEND_URL
      - key: ENABLE_SCHEDULER
        value: "true"
