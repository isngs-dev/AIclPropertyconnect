# One-click deploy on Render: ONE web service runs the website and the API together, plus a PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
databases:
  - name: aicl-db
    plan: free
    databaseName: aicl
    user: aicl

services:
  - type: web
    name: aicl-portal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aicl-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock            # switch to "paystack" and add PAYSTACK_SECRET_KEY for real test payments
      - key: ENABLE_SCHEDULER
        value: "true"
