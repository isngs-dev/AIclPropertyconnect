# One-click deploy of the whole AICL portal on Render: PostgreSQL + API (FastAPI) + website (Next.js).
# Render dashboard -> New -> Blueprint -> pick this repository -> Apply.
databases:
  - name: aicl-db
    plan: free
    databaseName: aicl
    user: aicl

services:
  - type: web
    name: aicl-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Creates the schema, loads the demo data once in the background (first start only), then serves the API.
    startCommand: sh -c "alembic upgrade head && (python -m app.seed > /tmp/seed.log 2>&1 &) && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: aicl-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock            # switch to "paystack" and add PAYSTACK_SECRET_KEY for real test payments
      - key: FRONTEND_URL
        value: https://aicl-web.onrender.com   # change if Render gives the website a different URL
      - key: CORS_ORIGINS
        value: https://aicl-web.onrender.com
      - key: ENABLE_SCHEDULER
        value: "true"

  - type: web
    name: aicl-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: API_HOSTPORT       # the API's private-network address; the website proxies /api/* to it
        fromService:
          type: web
          name: aicl-api
          property: hostport
